<script>
  async function playChannel(channelName) {
    const response = await fetch(`http://192.168.1.28:3000/stream?channel=${channelName}`);
    const data = await response.json();
  
    const video = document.getElementById('videoPlayer');
    video.src = data.url;
    video.play();
  }
  </script>
  
  <button onclick="playChannel('suntvhd')">Play Sun TV</button>
  
  <video id="videoPlayer" controls style="width:100%; max-width:800px;"></video>
